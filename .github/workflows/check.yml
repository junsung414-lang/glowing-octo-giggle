name: JOB ALERT check

on:
  # 주 실행: cron-job.org 가 매시 정각 workflow_dispatch API 를 호출 (GitHub 자체 스케줄은 실제로 몇 시간씩 밀림)
  workflow_dispatch:
  # 예비 실행: cron-job.org 가 멈춰도 완전히 끊기지 않도록 3시간마다 (GitHub 사정으로 늦어질 수 있음)
  schedule:
    - cron: "37 */3 * * *"

permissions:
  contents: write

concurrency:
  group: intern-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check jobs (Apple, Amazon/AWS, Microsoft, Google)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 check_jobs.py --kinds=인턴,정규직

      - name: Save state / keep schedule alive
        run: |
          git config user.name "intern-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain seen.json status.json screened.json)" ]; then
            for f in seen.json status.json screened.json; do [ -f "$f" ] && git add "$f"; done
            git commit -m "Update alert state"
            git pull -q --rebase && git push
          else
            # 저장소가 60일간 활동이 없으면 GitHub이 스케줄을 끄므로 45일마다 빈 커밋
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
              git commit --allow-empty -m "keepalive"
              git push
            fi
          fi
