name: JOB ALERT check

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정으로 몇 분 늦어질 수 있음)
  workflow_dispatch:          # Actions 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: intern-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check jobs (Apple, Amazon/AWS, Microsoft, Google)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 check_jobs.py

      - name: Save state / keep schedule alive
        run: |
          git config user.name "intern-alert-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain seen.json status.json)" ]; then
            git add seen.json status.json 2>/dev/null || git add seen.json
            git commit -m "Update alert state"
            git push
          else
            # 저장소가 60일간 활동이 없으면 GitHub이 스케줄을 끄므로 45일마다 빈 커밋
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
              git commit --allow-empty -m "keepalive"
              git push
            fi
          fi
